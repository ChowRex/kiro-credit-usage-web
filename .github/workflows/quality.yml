name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python and frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Verify locked Python dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Verify locked frontend dependencies
        run: npm ci

      - name: Validate container configuration
        run: docker compose --env-file docker/container.env.example -f docker/compose.yaml config --quiet

      - name: Check Python quality
        run: |
          .venv/bin/black --check app scripts tests
          .venv/bin/ruff check app scripts tests
          .venv/bin/mypy --strict app scripts tests
          .venv/bin/pylint app scripts tests
          .venv/bin/bandit -q -r app scripts
          .venv/bin/pip-audit --strict
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -v
          .venv/bin/coverage erase
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/coverage run -m unittest discover -s tests
          .venv/bin/coverage report

      - name: Check frontend quality
        run: npm run check

      - name: Check tracked source for secrets
        run: |
          git ls-files -z | xargs -0 .venv/bin/detect-secrets scan \
            > /tmp/detect-secrets.json
          python3 -c 'import json; import sys; sys.exit("secret candidates found" if json.load(open("/tmp/detect-secrets.json", encoding="utf-8"))["results"] else 0)'

      - name: Check Git diff hygiene
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
