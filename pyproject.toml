[project]
name = "kiro-credit-usage-web"
version = "0.1.0"
description = "Private-network Kiro Credits usage dashboard"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts", "tests"]
strict = true
explicit_package_bases = true
warn_unused_configs = true

[tool.pylint.main]
py-version = "3.11"
recursive = true

[tool.pylint.design]
# The schema validator and explicit public configuration constructors deliberately
# exceed generic defaults while preserving their fully validated APIs.
max-args = 9
max-positional-arguments = 9
max-attributes = 13
max-locals = 27
max-branches = 53
max-statements = 113
max-returns = 11

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
branch = true
source = ["app", "scripts"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "coverage>=7.17.0",
    "detect-secrets>=1.5.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pylint>=4.1.3",
    "ruff>=0.17.3",
]
