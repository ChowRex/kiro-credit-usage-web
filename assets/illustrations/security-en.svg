<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Kiro Credit Usage Web privacy boundaries</title><desc id="desc">A security diagram showing the browser separated from AWS credentials, which stay in a protected runtime directory for controlled server refresh paths.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#164e63"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="64" y="86" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">PRIVACY BY DESIGN</text><text x="64" y="134" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="700">Separate who can view data from what can access AWS</text><g font-family="Arial, sans-serif"><rect x="68" y="224" width="286" height="278" rx="24" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="104" y="276" fill="white" font-size="28" font-weight="700">Browser</text><circle cx="116" cy="327" r="20" fill="#1e40af"/><path d="M106 328h20m-10-10v20" stroke="#dbeafe" stroke-width="4"/><text x="151" y="334" fill="#c7d2fe" font-size="19">Reads same-origin API</text><text x="104" y="388" fill="#c7d2fe" font-size="19">Can download CSV</text><text x="104" y="452" fill="#fda4af" font-size="20" font-weight="700">Never receives AWS keys</text><rect x="458" y="194" width="302" height="337" rx="24" fill="#0f3d50" stroke="#2dd4bf" stroke-width="2"/><text x="496" y="248" fill="white" font-size="28" font-weight="700">Protected runtime</text><rect x="496" y="281" width="226" height="48" rx="11" fill="#155e75"/><text x="515" y="312" fill="#cffafe" font-size="18">AWS profile · read-only</text><rect x="496" y="346" width="226" height="48" rx="11" fill="#115e59"/><text x="515" y="377" fill="#ccfbf1" font-size="18">Admin token · web only</text><rect x="496" y="411" width="226" height="48" rx="11" fill="#1f3c35"/><text x="515" y="442" fill="#bbf7d0" font-size="18">Snapshots · persistent</text><path d="M838 234h237v263H838z" fill="#3f1d3f" stroke="#f472b6" stroke-width="2" rx="24"/><text x="875" y="281" fill="white" font-size="28" font-weight="700">Refresh paths</text><path d="M891 331l29 26 54-62" fill="none" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="875" y="413" fill="#fce7f3" font-size="19">Scheduled or manual</text><text x="875" y="443" fill="#fce7f3" font-size="19">AWS credentials</text></g><g fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"><path d="M360 364H448" marker-end="url(#arrow)"/><path d="M766 364H828" marker-end="url(#arrow)"/></g><text x="64" y="612" fill="#bae6fd" font-family="Arial, sans-serif" font-size="18">Owner-only files, read-only mounts, a read-only container filesystem, and no credentials in the browser.</text></svg>
