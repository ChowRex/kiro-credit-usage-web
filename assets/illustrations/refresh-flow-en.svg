<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Daily Kiro credit refresh flow</title><desc id="desc">A flow diagram of the daily scheduled refresh from scheduler to AWS data collection, validation, atomic snapshot publication, dashboard and CSV.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bae6fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="65" y="86" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">REFRESH LIFECYCLE</text><text x="65" y="126" fill="white" font-family="Arial, sans-serif" font-size="38" font-weight="700">A daily refresh preserves</text><text x="65" y="170" fill="white" font-family="Arial, sans-serif" font-size="38" font-weight="700">the last validated snapshot</text><g font-family="Arial, sans-serif" text-anchor="middle"><g><circle cx="145" cy="350" r="83" fill="#1d4ed8"/><text x="145" y="340" fill="white" font-size="26" font-weight="700">10:00</text><text x="145" y="372" fill="#dbeafe" font-size="17">Scheduler</text></g><g><circle cx="385" cy="350" r="83" fill="#0f766e"/><text x="385" y="340" fill="white" font-size="25" font-weight="700">Refresh</text><text x="385" y="372" fill="#ccfbf1" font-size="17">One-shot container</text></g><g><circle cx="625" cy="350" r="83" fill="#7c3aed"/><text x="625" y="340" fill="white" font-size="25" font-weight="700">Validate</text><text x="625" y="372" fill="#ede9fe" font-size="17">Bounds · schema</text></g><g><circle cx="865" cy="350" r="83" fill="#be185d"/><text x="865" y="340" fill="white" font-size="25" font-weight="700">Publish</text><text x="865" y="372" fill="#fce7f3" font-size="17">Atomic snapshot</text></g><g><circle cx="1080" cy="350" r="83" fill="#0f4c81"/><text x="1080" y="340" fill="white" font-size="25" font-weight="700">Use</text><text x="1080" y="372" fill="#dbeafe" font-size="17">Dashboard · CSV</text></g></g><g stroke="#bae6fd" stroke-width="7" fill="none" stroke-linecap="round"><path d="M235 350H295" marker-end="url(#arrow)"/><path d="M475 350H535" marker-end="url(#arrow)"/><path d="M715 350H775" marker-end="url(#arrow)"/><path d="M955 350H990" marker-end="url(#arrow)"/></g><rect x="290" y="508" width="620" height="67" rx="18" fill="#082f49" opacity=".82"/><path d="M325 529l12 20 28-35" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="538" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">A failure preserves the last validated snapshot.</text><text x="630" y="562" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Retry state and history remain durable.</text><text x="65" y="633" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="16">Queries are limited by the configured Athena WorkGroup and local collection bounds.</text></svg>
