<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Kiro Credit Usage Web 隐私边界</title><desc id="desc">展示浏览器与 AWS 凭证隔离，凭证仅保存在受保护运行目录并只供受控服务器刷新路径使用的安全示意图。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#164e63"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="64" y="86" fill="#ddd6fe" font-size="20" font-weight="700" letter-spacing="3">隐私保护设计</text><text x="64" y="134" fill="white" font-size="40" font-weight="700">将数据浏览者与 AWS 凭证访问者明确分离</text></g><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="68" y="224" width="286" height="278" rx="24" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="104" y="276" fill="white" font-size="28" font-weight="700">浏览器</text><circle cx="116" cy="327" r="20" fill="#1e40af"/><path d="M106 328h20m-10-10v20" stroke="#dbeafe" stroke-width="4"/><text x="151" y="334" fill="#c7d2fe" font-size="19">读取同源 API</text><text x="104" y="388" fill="#c7d2fe" font-size="19">可以下载 CSV</text><text x="104" y="452" fill="#fda4af" font-size="20" font-weight="700">永远不接触 AWS 密钥</text><rect x="458" y="194" width="302" height="337" rx="24" fill="#0f3d50" stroke="#2dd4bf" stroke-width="2"/><text x="496" y="248" fill="white" font-size="28" font-weight="700">受保护运行目录</text><rect x="496" y="281" width="226" height="48" rx="11" fill="#155e75"/><text x="515" y="312" fill="#cffafe" font-size="18">AWS profile · 只读</text><rect x="496" y="346" width="226" height="48" rx="11" fill="#115e59"/><text x="515" y="377" fill="#ccfbf1" font-size="18">管理员 Token · 仅 Web</text><rect x="496" y="411" width="226" height="48" rx="11" fill="#1f3c35"/><text x="515" y="442" fill="#bbf7d0" font-size="18">快照 · 持久化</text><path d="M838 234h237v263H838z" fill="#3f1d3f" stroke="#f472b6" stroke-width="2" rx="24"/><text x="875" y="281" fill="white" font-size="28" font-weight="700">刷新路径</text><path d="M891 331l29 26 54-62" fill="none" stroke="#f9a8d4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="875" y="413" fill="#fce7f3" font-size="19">定时或手动刷新</text><text x="875" y="443" fill="#fce7f3" font-size="19">AWS 凭证</text></g><g fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"><path d="M360 364H448" marker-end="url(#arrow)"/><path d="M766 364H828" marker-end="url(#arrow)"/></g><text x="64" y="612" fill="#bae6fd" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18">仅所有者可读文件、只读挂载、只读容器根文件系统，以及浏览器中绝不出现凭证。</text></svg>
