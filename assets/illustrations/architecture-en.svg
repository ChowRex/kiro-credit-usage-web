<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Kiro Credit Usage Web deployment architecture</title><desc id="desc">A deployment diagram showing an intranet browser through Nginx to a Docker dashboard, persistent runtime data, scheduled refresh, and AWS data services.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091827"/><stop offset="1" stop-color="#173a5e"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="64" y="83" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">DEPLOYMENT ARCHITECTURE</text><text x="64" y="132" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="700">One dashboard, separated responsibilities</text><g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="64" y="223" width="190" height="145" rx="20" fill="#123554" stroke="#3b82f6"/><text x="94" y="274" fill="white" font-size="25" font-weight="700">Intranet browser</text><text x="94" y="310" fill="#bfdbfe" font-size="17">Read dashboard</text><text x="94" y="337" fill="#bfdbfe" font-size="17">Download CSV</text><rect x="326" y="223" width="190" height="145" rx="20" fill="#123554" stroke="#60a5fa"/><text x="365" y="274" fill="white" font-size="25" font-weight="700">Nginx</text><text x="359" y="310" fill="#bfdbfe" font-size="17">TLS · path proxy</text><text x="359" y="337" fill="#bfdbfe" font-size="17">Network boundary</text><rect x="585" y="192" width="250" height="208" rx="20" fill="#0b4350" stroke="#2dd4bf"/><text x="710" y="246" text-anchor="middle" fill="white" font-size="25" font-weight="700">Docker Compose</text><rect x="610" y="270" width="200" height="42" rx="10" fill="#115e59"/><text x="710" y="298" text-anchor="middle" fill="#ccfbf1" font-size="18" font-weight="700">web · long-running</text><rect x="610" y="327" width="200" height="42" rx="10" fill="#164e63"/><text x="710" y="355" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="700">refresh · one-shot</text><rect x="905" y="192" width="230" height="208" rx="20" fill="#3b2a58" stroke="#c084fc"/><text x="938" y="246" fill="white" font-size="25" font-weight="700">AWS data plane</text><text x="938" y="288" fill="#e9d5ff" font-size="17">Athena queries</text><text x="938" y="317" fill="#e9d5ff" font-size="17">S3 source data</text><text x="938" y="346" fill="#e9d5ff" font-size="17">Identity Center</text><rect x="585" y="486" width="250" height="102" rx="20" fill="#1f3c35" stroke="#34d399"/><text x="620" y="529" fill="white" font-size="24" font-weight="700">Private runtime</text><text x="620" y="558" fill="#bbf7d0" font-size="17">Snapshots · history · logs</text></g><g fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"><path d="M260 295H315" marker-end="url(#arrow)"/><path d="M522 295H577" marker-end="url(#arrow)"/><path d="M839 295H894" marker-end="url(#arrow)"/><path d="M710 406V474" marker-end="url(#arrow)"/></g><text x="64" y="635" fill="#9cc8ea" font-family="Arial, sans-serif" font-size="16">Private credentials remain in the runtime directory. The browser never receives AWS credentials.</text></svg>
