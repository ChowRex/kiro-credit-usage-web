<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">每日 Kiro Credits 刷新流程</title><desc id="desc">展示定时刷新从调度、AWS 数据采集、校验、原子发布快照到看板与 CSV 的流程图。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bae6fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="65" y="86" fill="#ccfbf1" font-size="20" font-weight="700" letter-spacing="3">刷新生命周期</text><text x="65" y="134" fill="white" font-size="40" font-weight="700">受限的每日刷新，始终保护最后一份有效快照</text></g><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle"><g><circle cx="145" cy="350" r="83" fill="#1d4ed8"/><text x="145" y="340" fill="white" font-size="26" font-weight="700">10:00</text><text x="145" y="372" fill="#dbeafe" font-size="17">定时调度</text></g><g><circle cx="385" cy="350" r="83" fill="#0f766e"/><text x="385" y="340" fill="white" font-size="25" font-weight="700">刷新</text><text x="385" y="372" fill="#ccfbf1" font-size="17">一次性容器</text></g><g><circle cx="625" cy="350" r="83" fill="#7c3aed"/><text x="625" y="340" fill="white" font-size="25" font-weight="700">校验</text><text x="625" y="372" fill="#ede9fe" font-size="17">边界 · Schema</text></g><g><circle cx="865" cy="350" r="83" fill="#be185d"/><text x="865" y="340" fill="white" font-size="25" font-weight="700">发布</text><text x="865" y="372" fill="#fce7f3" font-size="17">原子化快照</text></g><g><circle cx="1080" cy="350" r="83" fill="#0f4c81"/><text x="1080" y="340" fill="white" font-size="25" font-weight="700">使用</text><text x="1080" y="372" fill="#dbeafe" font-size="17">看板 · CSV</text></g></g><g stroke="#bae6fd" stroke-width="7" fill="none" stroke-linecap="round"><path d="M235 350H295" marker-end="url(#arrow)"/><path d="M475 350H535" marker-end="url(#arrow)"/><path d="M715 350H775" marker-end="url(#arrow)"/><path d="M955 350H990" marker-end="url(#arrow)"/></g><rect x="290" y="508" width="620" height="67" rx="18" fill="#082f49" opacity=".82"/><path d="M325 529l12 20 28-35" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="385" y="551" fill="white" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">刷新失败不会覆盖有效快照。重试状态与历史始终保留。</text><text x="65" y="633" fill="#bfdbfe" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">Athena 查询受配置的 WorkGroup 与本地采集边界共同限制。</text></svg>
